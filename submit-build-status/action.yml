---
name: Submit Build Status

description: Submits the build status of a GHA workflow job to CI Analytics. See https://confluence.camunda.com/display/HAN/CI+Analytics

inputs:
  build_status:
    description: String representing the build status that should be submitted to CI Analytics, e.g. "success", "failed", "cancelled".
    required: true
  build_duration_millis:
    description: Optional non-negative build duration in milliseconds. Overrides the duration collected by start-build-monitor.
    required: false
  user_reason:
    description: Optional string (200 chars max) the user can submit to indicate the reason why a build has ended with a certain build status , e.g. "flaky-tests".
    required: false
    default: ''
  user_description:
    description: Optional string (1000 chars max) the user can submit to provide details on the user_reason, e.g. a list of flaky tests.
    required: false
    default: ''

  gcp_credentials_json:
    description: Optional credentials for a Google Cloud ServiceAccount allowed to publish to Big Query formatted as contents of credentials.json file. Takes precedence over WIF.
    required: false
  gcp_workload_identity_provider:
    description: Full Workload Identity Provider resource name. Used only when gcp_credentials_json is empty.
    required: false
    default: 'projects/502682377344/locations/global/workloadIdentityPools/ci-gha-workload-pool/providers/gha-provider'
  gcp_service_account:
    description: Google Cloud service account email to impersonate for WIF; must be allowed to publish to Big Query. Used only when gcp_credentials_json is empty.
    required: false
    default: 'prod-ci-analytics-writer@ci-30-162810.iam.gserviceaccount.com'

  job_name_override:
    description: Optional string being used for the `job_name` field instead of the default `$GITHUB_JOB` useful e.g. for matrix builds
    required: false
    default: ''

  big_query_table_name:
    description: Use only for infrastructure testing purposes to target e.g. dev environment.
    required: false
    default: 'ci-30-162810:prod_ci_analytics.build_status_v2'

runs:
  using: composite
  steps:
  - name: Echo inputs
    shell: bash
    env:
      BUILD_STATUS: "${{ inputs.build_status }}"
      BUILD_DURATION_MILLIS: "${{ inputs.build_duration_millis }}"
      HAS_EXPLICIT_BUILD_DURATION: "${{ inputs.build_duration_millis != '' }}"
      USER_REASON: "${{ inputs.user_reason }}"
      USER_DESCRIPTION: "${{ inputs.user_description }}"
      JOB_NAME_OVERRIDE: "${{ inputs.job_name_override }}"
      BIG_QUERY_TABLE_NAME: "${{ inputs.big_query_table_name }}"
    run: |
      echo "Inputs"
      echo "-----"
      echo "Build status: $BUILD_STATUS"
      echo "Build duration (in ms): $BUILD_DURATION_MILLIS"
      echo "Build duration provided as input: $HAS_EXPLICIT_BUILD_DURATION"
      echo "User reason: $USER_REASON"
      echo "User description: $USER_DESCRIPTION"
      echo "Job name override: $JOB_NAME_OVERRIDE (default job name: $GITHUB_JOB)"
      echo "BQ table name (for testing): $BIG_QUERY_TABLE_NAME"

  - name: Validate inputs
    id: validate
    shell: bash
    env:
      BUILD_STATUS: "${{ inputs.build_status }}"
      BUILD_DURATION_MILLIS: "${{ inputs.build_duration_millis }}"
      USER_REASON: "${{ inputs.user_reason }}"
      USER_DESCRIPTION: "${{ inputs.user_description }}"
      HAS_GCP_CREDENTIALS_JSON: "${{ inputs.gcp_credentials_json != '' }}"
      GCP_WORKLOAD_IDENTITY_PROVIDER: "${{ inputs.gcp_workload_identity_provider }}"
      GCP_SERVICE_ACCOUNT: "${{ inputs.gcp_service_account }}"
    run: |
      if [ "$BUILD_STATUS" == "" ]; then
        echo "Need to specify a build status that is not empty!"
        exit 1
      fi

      if [ "${#USER_REASON}" -gt 200 ]; then
        echo "Specified user reason has more than 200 characters!"
        exit 1
      fi

      if [ "${#USER_DESCRIPTION}" -gt 1000 ]; then
        echo "Specified user description has more than 1000 characters!"
        exit 1
      fi

      if [ "$HAS_GCP_CREDENTIALS_JSON" = "true" ]; then
        echo "Google Cloud authentication: token-based (service account JSON credentials)"
        GCP_WORKLOAD_IDENTITY_PROVIDER=""
        GCP_SERVICE_ACCOUNT=""
      else
        if [[ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER//[[:space:]]/}" ||
              -z "${GCP_SERVICE_ACCOUNT//[[:space:]]/}" ]]; then
          echo "::error::gcp_workload_identity_provider and gcp_service_account must be non-empty when gcp_credentials_json is not provided."
          exit 1
        fi
        if [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER$GCP_SERVICE_ACCOUNT" == *$'\n'* ||
              "$GCP_WORKLOAD_IDENTITY_PROVIDER$GCP_SERVICE_ACCOUNT" == *$'\r'* ]]; then
          echo "::error::gcp_workload_identity_provider and gcp_service_account must be single-line values."
          exit 1
        fi
        echo "Google Cloud authentication: Workload Identity Federation (WIF)"
      fi

      if [ -n "$BUILD_DURATION_MILLIS" ]; then
        MAX_BUILD_DURATION_MILLIS=259200000  # 72 hours
        if ! [[ "$BUILD_DURATION_MILLIS" =~ ^[0-9]+$ ]]; then
          echo "::warning::Build duration must be a non-negative integer; duration omitted."
          BUILD_DURATION_MILLIS=""
        else
          # Strip leading zeros so numeric comparisons use decimal values.
          BUILD_DURATION_MILLIS="${BUILD_DURATION_MILLIS#"${BUILD_DURATION_MILLIS%%[!0]*}"}"
          BUILD_DURATION_MILLIS="${BUILD_DURATION_MILLIS:-0}"
          # Check length before comparing numerically to avoid integer overflow.
          if [ "${#BUILD_DURATION_MILLIS}" -gt "${#MAX_BUILD_DURATION_MILLIS}" ] ||
            { [ "${#BUILD_DURATION_MILLIS}" -eq "${#MAX_BUILD_DURATION_MILLIS}" ] &&
              [ "$BUILD_DURATION_MILLIS" -gt "$MAX_BUILD_DURATION_MILLIS" ]; }; then
            echo "::warning::Build duration must not exceed ${MAX_BUILD_DURATION_MILLIS} milliseconds; duration omitted."
            BUILD_DURATION_MILLIS=""
          fi
        fi
      fi
      {
        printf 'build_duration_millis=%s\n' "$BUILD_DURATION_MILLIS"
        printf 'workload_identity_provider=%s\n' "$GCP_WORKLOAD_IDENTITY_PROVIDER"
        printf 'service_account=%s\n' "$GCP_SERVICE_ACCOUNT"
      } >> "$GITHUB_OUTPUT"

  - name: Login to Google Cloud
    id: auth
    uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
    with:
      credentials_json: '${{ inputs.gcp_credentials_json }}'
      workload_identity_provider: '${{ steps.validate.outputs.workload_identity_provider }}'
      service_account: '${{ steps.validate.outputs.service_account }}'
      token_format: 'access_token'

  - name: Collect resource usage metrics
    id: monitor
    shell: bash
    run: |
      bash "$GITHUB_ACTION_PATH/stop-and-collect-build-monitor.sh" "$GITHUB_OUTPUT"

  - name: Resolve build duration
    id: duration
    shell: bash
    env:
      HAS_EXPLICIT_BUILD_DURATION: "${{ inputs.build_duration_millis != '' }}"
      EXPLICIT_BUILD_DURATION_MILLIS: "${{ steps.validate.outputs.build_duration_millis }}"
      MONITOR_BUILD_DURATION_MILLIS: "${{ steps.monitor.outputs.build_duration_millis }}"
    run: |
      if [ "$HAS_EXPLICIT_BUILD_DURATION" = "true" ]; then
        echo "Using build duration from inputs"
        BUILD_DURATION_MILLIS="$EXPLICIT_BUILD_DURATION_MILLIS"
      else
        echo "Using build duration from internal calculations"
        BUILD_DURATION_MILLIS="$MONITOR_BUILD_DURATION_MILLIS"
      fi
      printf 'build_duration_millis=%s\n' "$BUILD_DURATION_MILLIS" >> "$GITHUB_OUTPUT"

  - name: Submit build status to CI Analytics
    shell: bash
    env:
      BUILD_STATUS: "${{ inputs.build_status }}"
      JOB_NAME_OVERRIDE: "${{ inputs.job_name_override }}"
      USER_REASON: "${{ inputs.user_reason }}"
      USER_DESCRIPTION: "${{ inputs.user_description }}"
      BIG_QUERY_TABLE_NAME: "${{ inputs.big_query_table_name }}"
      BUILD_BASE_REF: "${{ github.base_ref && format('refs/heads/{0}', github.base_ref) || github.event.merge_group.base_ref }}"
      BUILD_HEAD_REF: "${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.event.merge_group.head_ref }}"
      BUILD_DURATION_MILLIS: "${{ steps.duration.outputs.build_duration_millis }}"
      # Resource and network metrics as a JSON fragment ', "key": number, ...' (might be empty).
      MONITOR_FIELDS: "${{ steps.monitor.outputs.monitor_fields }}"
      ACCESS_TOKEN: "${{ steps.auth.outputs.access_token }}"
      JOB_ID: "${{ job.check_run_id }}"
      RUNNER_INFO_RUNS_ON_FILE: "/home/runner/.camunda-arc-runner-info/runs-on"
    run: |
      WORKFLOW_REF_PATH="${GITHUB_WORKFLOW_REF%@*}"
      WORKFLOW_REF_PATH="${WORKFLOW_REF_PATH#"$GITHUB_REPOSITORY/"}"

      # ── Parse BigQuery table name (format: project_id:dataset.table) ──
      PROJECT_ID="${BIG_QUERY_TABLE_NAME%%:*}"
      DATASET_TABLE="${BIG_QUERY_TABLE_NAME#*:}"
      DATASET="${DATASET_TABLE%%.*}"
      TABLE="${DATASET_TABLE#*.}"

      # Print $1 as a JSON string, dropping control chars other than \n \r \t (Bash only: job containers may lack jq).
      json_string() {
        local s="$1" bs=\\ q=\"
        # Unquoted on purpose: Bash < 4.3 keeps the replacement's inner quotes inside "${...}".
        s=${s//"$bs"/"$bs$bs"}
        s=${s//"$q"/"$bs$q"}
        s=${s//$'\n'/"${bs}n"}
        s=${s//$'\r'/"${bs}r"}
        s=${s//$'\t'/"${bs}t"}
        printf '"%s"' "$(printf '%s' "$s" | tr -d '\001-\037')"
      }
      lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

      # ── Row fields; each name is a BigQuery column and every value is JSON-escaped ──
      ROW=""
      add_field() { ROW="${ROW:+$ROW, }$(json_string "$1"): $(json_string "$2")"; }
      add_field report_time "$(date -u '+%Y-%m-%d %H:%M:%S')"
      add_field ci_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      add_field workflow_name "$GITHUB_WORKFLOW"
      add_field workflow_ref "$WORKFLOW_REF_PATH"
      add_field job_name "${JOB_NAME_OVERRIDE:-$GITHUB_JOB}"
      add_field build_id "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      add_field build_trigger "$GITHUB_EVENT_NAME"
      add_field build_status "$BUILD_STATUS"
      add_field build_ref "$GITHUB_REF"
      add_field runner_name "$(lower "$RUNNER_NAME")"
      add_field runner_arch "$(lower "$RUNNER_ARCH")"
      add_field runner_os "$(lower "$RUNNER_OS")"
      # Optional fields are sent only when set.
      [ -z "$JOB_ID" ] || add_field job_id "$JOB_ID"
      [ -z "$BUILD_BASE_REF" ] || add_field build_base_ref "$BUILD_BASE_REF"
      [ -z "$BUILD_HEAD_REF" ] || add_field build_head_ref "$BUILD_HEAD_REF"
      [ -z "$BUILD_DURATION_MILLIS" ] || add_field build_duration_milliseconds "$BUILD_DURATION_MILLIS"
      [ -z "$USER_REASON" ] || add_field user_reason "$USER_REASON"
      [ -z "$USER_DESCRIPTION" ] || add_field user_description "$USER_DESCRIPTION"
      if [ -f "$RUNNER_INFO_RUNS_ON_FILE" ]; then
        # The runs-on label from GHA jobs represents the runner type for self-hosted runners.
        add_field runner_type "$(tr -cd '[:alnum:]_. -' < "$RUNNER_INFO_RUNS_ON_FILE")"
      fi

      # Create insertAll request payload; MONITOR_FIELDS is already ', "key": number, ...'.
      PAYLOAD=$(printf '{"rows": [{"json": {%s%s}}]}' "$ROW" "$MONITOR_FIELDS")

      # Submit to BigQuery REST API
      echo "Submitting build status to BigQuery..."
      curl -fsS -X POST \
        "https://bigquery.googleapis.com/bigquery/v2/projects/${PROJECT_ID}/datasets/${DATASET}/tables/${TABLE}/insertAll" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "$PAYLOAD"
