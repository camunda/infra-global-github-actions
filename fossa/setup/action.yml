name: fossa setup

description: Install FOSSA CLI

inputs:
  version:
    description: Version of the FOSSA CLI to install
    # renovate: datasource=github-releases depName=fossas/fossa-cli
    default: 3.18.4
    required: true
runs:
  using: composite
  steps:
    - name: Install FOSSA CLI
      env:
        FOSSA_CLI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [[ "${RUNNER_OS}" != "Linux" ]]; then
          echo "::error::Unsupported runner OS '${RUNNER_OS}'. FOSSA CLI installation currently supports Linux runners only."
          exit 1
        fi

        case "${RUNNER_ARCH}" in
          X64)
            FOSSA_CLI_ARCH="linux_amd64"
            ;;
          ARM64)
            FOSSA_CLI_ARCH="linux_arm64"
            ;;
          *)
            echo "::error::Unsupported runner architecture '${RUNNER_ARCH}'. FOSSA CLI installation supports X64 and ARM64 runners."
            exit 1
            ;;
        esac

        echo "Runner architecture '${RUNNER_ARCH}' detected; installing FOSSA CLI architecture '${FOSSA_CLI_ARCH}'."

        if ! command -v fossa &> /dev/null
        then
          echo "FOSSA CLI not found, installing version=${FOSSA_CLI_VERSION}..."

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          asset="fossa_${FOSSA_CLI_VERSION}_${FOSSA_CLI_ARCH}.tar.gz"
          release="https://github.com/fossas/fossa-cli/releases/download/v${FOSSA_CLI_VERSION}"

          # Download to a file rather than piping into tar: a connection reset
          # mid-transfer otherwise reaches tar as a truncated stream, which fails
          # the job with an unrecoverable EOF that no retry can undo. Retries also
          # need a fresh start, which a consumed pipe cannot give them.
          # --proto-redir matters as much as --proto: the release URL redirects to
          # a CDN, and curl allows plain HTTP on redirect by default. Both files
          # travel this path, so anyone able to downgrade it would serve the
          # tarball and the checksum that matches it.
          curl --fail --silent --show-error --location \
               --proto '=https' --proto-redir '=https' \
               --retry 5 --retry-all-errors \
               -H 'Cache-Control: no-cache' \
               --output "${workdir}/${asset}" "${release}/${asset}"

          curl --fail --silent --show-error --location \
               --proto '=https' --proto-redir '=https' \
               --retry 5 --retry-all-errors \
               -H 'Cache-Control: no-cache' \
               --output "${workdir}/${asset}.sha256" "${release}/${asset}.sha256"

          # Upstream publishes "<sha256> *<asset>", which sha256sum -c reads directly.
          # Verifying catches a silently truncated body that still exited 0.
          (cd "${workdir}" && sha256sum --check --strict "${asset}.sha256")

          sudo tar -xz -C /usr/local/bin -f "${workdir}/${asset}"
        else
          echo "FOSSA CLI is already installed"
        fi
      shell: bash
