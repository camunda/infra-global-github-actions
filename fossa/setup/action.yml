name: fossa setup

description: Install FOSSA CLI

inputs:
  version:
    description: Version of the FOSSA CLI to install
    # renovate: datasource=github-releases depName=fossas/fossa-cli
    default: 3.18.4
    required: true
runs:
  using: composite
  steps:
    - name: Install FOSSA CLI
      env:
        FOSSA_CLI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [[ "${RUNNER_OS}" != "Linux" ]]; then
          echo "::error::Unsupported runner OS '${RUNNER_OS}'. FOSSA CLI installation currently supports Linux runners only."
          exit 1
        fi

        case "${RUNNER_ARCH}" in
          X64)
            FOSSA_CLI_ARCH="linux_amd64"
            ;;
          ARM64)
            FOSSA_CLI_ARCH="linux_arm64"
            ;;
          *)
            echo "::error::Unsupported runner architecture '${RUNNER_ARCH}'. FOSSA CLI installation supports X64 and ARM64 runners."
            exit 1
            ;;
        esac

        echo "Runner architecture '${RUNNER_ARCH}' detected; installing FOSSA CLI architecture '${FOSSA_CLI_ARCH}'."

        if ! command -v fossa &> /dev/null
        then
          echo "FOSSA CLI not found, installing version=${FOSSA_CLI_VERSION}..."
          curl \
            -fsSL \
            -H 'Cache-Control: no-cache' \
            "https://github.com/fossas/fossa-cli/releases/download/v${FOSSA_CLI_VERSION}/fossa_${FOSSA_CLI_VERSION}_${FOSSA_CLI_ARCH}.tar.gz" | \
           sudo tar -xz -C /usr/local/bin
        else
          echo "FOSSA CLI is already installed"
        fi
      shell: bash
