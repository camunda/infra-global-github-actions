description: >-
  Jobs report their status to build_status_v2: start-build-monitor runs first, and
  submit-build-status or the local observe-build-status wrapper runs last, best-effort.

params:
  first-step: camunda/infra-global-github-actions/start-build-monitor
  last-step-any-of:
    - camunda/infra-global-github-actions/submit-build-status
    - ./.github/actions/observe-build-status

exceptions:
  - workflow: "*"
    jobs: [notify, notify-on-failure, notify-on-success]
    reason: Notification-only jobs are not monitored
