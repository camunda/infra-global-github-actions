---
# Consuming side of test-vault-wrapped-secrets.yml: receives the wrapping token as a secret, so GitHub masks it in this job's log.
name: Test vault-wrapped-secrets unwrap

on:
  workflow_call:
    inputs:
      shard:
        type: string
        required: true
    secrets:
      VAULT_ADDR:
        required: true
      WRAP_TOKEN:
        required: true

permissions: {}

jobs:
  unwrap:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check that this job has no OIDC token
      run: |
        if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "::error::The unwrap job must run without id-token: write"
          exit 1
        fi
    - name: Unwrap the test secret
      id: unwrap
      uses: ./vault-wrapped-secrets/unwrap
      with:
        vault-url: ${{ secrets.VAULT_ADDR }}
        wrap-token: ${{ secrets.WRAP_TOKEN }}
        export-env: 'true'
    - name: Check the unwrapped secret
      env:
        FROM_OUTPUT: ${{ fromJSON(steps.unwrap.outputs.secrets).APP_ID }}
        EXTRA_FROM_OUTPUT: ${{ fromJSON(steps.unwrap.outputs.secrets).EXTRA }}
        SHARD_FROM_OUTPUT: ${{ fromJSON(steps.unwrap.outputs.secrets).SHARD }}
        WANT_SHARD: ${{ inputs.shard }}
      run: |
        if [[ ! "${FROM_OUTPUT}" =~ ^[0-9]+$ || "${APP_ID:-}" != "${FROM_OUTPUT}" ]]; then
          echo "::error::Unwrapped APP_ID missing or inconsistent between output and env"
          exit 1
        fi
        if [[ "${EXTRA_FROM_OUTPUT}" != "100%25 not a secret" || "${EXTRA:-}" != "${EXTRA_FROM_OUTPUT}" ]]; then
          echo "::error::Unwrapped EXTRA missing or altered"
          exit 1
        fi
        if [[ "${SHARD_FROM_OUTPUT}" != "${WANT_SHARD}" ]]; then
          echo "::error::Shard ${WANT_SHARD} unwrapped the token of shard ${SHARD_FROM_OUTPUT}"
          exit 1
        fi
    - name: Unwrap the same token again
      id: second
      continue-on-error: true
      uses: ./vault-wrapped-secrets/unwrap
      with:
        vault-url: ${{ secrets.VAULT_ADDR }}
        wrap-token: ${{ secrets.WRAP_TOKEN }}
    - name: Check that the second unwrap was rejected
      env:
        OUTCOME: ${{ steps.second.outcome }}
      run: |
        if [[ "${OUTCOME}" != "failure" ]]; then
          echo "::error::A wrapping token was unwrapped twice"
          exit 1
        fi
