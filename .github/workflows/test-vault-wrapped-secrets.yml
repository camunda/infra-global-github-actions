---
# Unit tests of unwrap's error handling, plus an end-to-end smoketest of vault-wrapped-secrets: wrap in an OIDC job, hand the token over as a reusable-workflow secret, unwrap once in a job without OIDC, reject a second unwrap.
name: Test vault-wrapped-secrets

on:
  pull_request:
    paths:
    - 'vault-wrapped-secrets/**'
    - '.github/workflows/test-vault-wrapped-secrets.yml'
    - '.github/workflows/test-vault-wrapped-secrets-unwrap.yml'

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Test unwrap error handling with a stubbed Vault
      run: vault-wrapped-secrets/unwrap/test_unwrap.sh

  wrap:
    # Forked pull requests get no OIDC token and no Vault secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token for the Vault JWT login
    outputs:
      wrap-token-a: ${{ steps.wrap-a.outputs.wrap-token }}
      wrap-token-b: ${{ steps.wrap-b.outputs.wrap-token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Wrap a test secret for shard a
      id: wrap-a
      uses: ./vault-wrapped-secrets/wrap
      with:
        vault-url: ${{ secrets.VAULT_ADDR }}
        vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
        vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
        vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        secrets: |
          secret/data/products/infra/ci/team-infrastructure GITHUB_APP_ID | APP_ID;
        values: '{"EXTRA": "100%25 not a secret", "SHARD": "a"}'
        wrap-ttl: 5m
    - name: Wrap a test secret for shard b
      id: wrap-b
      uses: ./vault-wrapped-secrets/wrap
      with:
        vault-url: ${{ secrets.VAULT_ADDR }}
        vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
        vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
        vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        secrets: |
          secret/data/products/infra/ci/team-infrastructure GITHUB_APP_ID | APP_ID;
        values: '{"EXTRA": "100%25 not a secret", "SHARD": "b"}'
        wrap-ttl: 5m

  unwrap:
    needs: wrap
    strategy:
      matrix:
        shard: [a, b]
    permissions:
      contents: read
    uses: ./.github/workflows/test-vault-wrapped-secrets-unwrap.yml
    with:
      shard: ${{ matrix.shard }}
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      WRAP_TOKEN: ${{ needs.wrap.outputs[format('wrap-token-{0}', matrix.shard)] }}
