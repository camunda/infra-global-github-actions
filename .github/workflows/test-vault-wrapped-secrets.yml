---
# End-to-end smoketest of vault-wrapped-secrets: wrap in an OIDC job, unwrap once in a job without OIDC, reject a second unwrap.
name: Test vault-wrapped-secrets

on:
  pull_request:
    paths:
    - 'vault-wrapped-secrets/**'
    - '.github/workflows/test-vault-wrapped-secrets.yml'

permissions: {}

jobs:
  wrap:
    # Forked pull requests get no OIDC token and no Vault secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token for the Vault JWT login
    outputs:
      wrap-token: ${{ steps.wrap.outputs.wrap-token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Wrap a test secret
      id: wrap
      uses: ./vault-wrapped-secrets/wrap
      with:
        vault-url: ${{ secrets.VAULT_ADDR }}
        vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
        vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
        vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        secrets: |
          secret/data/products/infra/ci/team-infrastructure GITHUB_APP_ID | APP_ID;
        wrap-ttl: 10m

  unwrap:
    needs: wrap
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check that this job has no OIDC token
      run: |
        if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "::error::The unwrap job must run without id-token: write"
          exit 1
        fi
    - name: Unwrap the test secret
      id: unwrap
      uses: ./vault-wrapped-secrets/unwrap
      with:
        vault-url: ${{ secrets.VAULT_ADDR }}
        wrap-token: ${{ needs.wrap.outputs.wrap-token }}
        export-env: 'true'
    - name: Check the unwrapped secret
      env:
        FROM_OUTPUT: ${{ fromJSON(steps.unwrap.outputs.secrets).APP_ID }}
      run: |
        if [[ ! "${FROM_OUTPUT}" =~ ^[0-9]+$ || "${APP_ID:-}" != "${FROM_OUTPUT}" ]]; then
          echo "::error::Unwrapped APP_ID missing or inconsistent between output and env"
          exit 1
        fi
    - name: Unwrap the same token again
      id: second
      continue-on-error: true
      uses: ./vault-wrapped-secrets/unwrap
      with:
        vault-url: ${{ secrets.VAULT_ADDR }}
        wrap-token: ${{ needs.wrap.outputs.wrap-token }}
    - name: Check that the second unwrap was rejected
      env:
        OUTCOME: ${{ steps.second.outcome }}
      run: |
        if [[ "${OUTCOME}" != "failure" ]]; then
          echo "::error::A wrapping token was unwrapped twice"
          exit 1
        fi
