---
# End-to-end smoketest of vault-wrapped-secrets: wrap in an OIDC job, hand the token over as a reusable-workflow secret, unwrap once in a job without OIDC, reject a second unwrap.
name: Test vault-wrapped-secrets

on:
  pull_request:
    paths:
    - 'vault-wrapped-secrets/**'
    - '.github/workflows/test-vault-wrapped-secrets.yml'
    - '.github/workflows/test-vault-wrapped-secrets-unwrap.yml'

permissions: {}

jobs:
  wrap:
    # Forked pull requests get no OIDC token and no Vault secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token for the Vault JWT login
    outputs:
      wrap-token: ${{ steps.wrap.outputs.wrap-token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Wrap a test secret
      id: wrap
      uses: ./vault-wrapped-secrets/wrap
      with:
        vault-url: ${{ secrets.VAULT_ADDR }}
        vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
        vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
        vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        secrets: |
          secret/data/products/infra/ci/team-infrastructure GITHUB_APP_ID | APP_ID;
        values: '{"EXTRA": "100%25 not a secret"}'
        wrap-ttl: 5m

  unwrap:
    needs: wrap
    permissions:
      contents: read
    uses: ./.github/workflows/test-vault-wrapped-secrets-unwrap.yml
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      WRAP_TOKEN: ${{ needs.wrap.outputs.wrap-token }}
