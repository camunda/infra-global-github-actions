---
name: Test generate-github-app-token-from-vault-secrets

on:
  pull_request:
    paths:
    - 'generate-github-app-token-from-vault-secrets/**'
    - '.github/workflows/test-generate-github-app-token-from-vault-secrets.yml'

permissions:
  contents: read

jobs:
  # Only the `permissions` validation is covered. The rest of the action needs
  # Vault and a GitHub App, so it cannot run here — and driving the validation
  # through the action would not test it either: a rejection and a later Vault
  # failure both surface as "the step failed", so the assertion would stay green
  # if the validation stopped rejecting anything.
  test-permissions-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate the permissions input
      run: |
        ./generate-github-app-token-from-vault-secrets/validate-permissions_test.sh
      shell: bash

  # The forwarded scopes have to follow actions/create-github-app-token, and the
  # moment they silently stop is a bump of its pinned SHA. That is when this
  # runs: the path filter above covers action.yml, so a Renovate bump trips it.
  #
  # Kept out of the job above because it reaches the network, and a blip there
  # should not be mistaken for the validation being broken. No schedule: content
  # at a pinned SHA does not change, so this can only start failing because
  # someone moved the pin.
  test-permissions-match-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check the forwarded scopes against the pinned upstream revision
      run: |
        ./generate-github-app-token-from-vault-secrets/check-permissions-match-upstream.sh
      shell: bash
